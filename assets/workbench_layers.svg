<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <filter id="layerShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#0E0E0C" flood-opacity="1" />
    </filter>
    <linearGradient id="layerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF5FA" />
      <stop offset="100%" stop-color="#E2EEF7" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <rect width="1200" height="320" rx="28" fill="url(#layerBg)" stroke="#0E0E0C" stroke-width="4" />

  <!-- Section Title -->
  <g transform="translate(40, 28)">
    <rect width="250" height="28" rx="14" fill="#0E0E0C" />
    <circle cx="16" cy="14" r="4" fill="#FFF48D" />
    <text x="28" y="18" class="mono" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="0.1em">
      EXPLAINABLE AI WORKBENCH
    </text>
    <text x="270" y="20" class="sans" font-size="14" font-weight="900" fill="#0E0E0C" text-transform="uppercase">
      6-Layer Synchronized Diagnostic Optical Canvas
    </text>
  </g>

  <!-- 6 LAYER CARDS -->
  <!-- Layer 1: Raw Original -->
  <g transform="translate(40, 75)" filter="url(#layerShadow)">
    <rect width="170" height="205" rx="18" fill="#FFFFFF" stroke="#0E0E0C" stroke-width="2.5" />
    <g transform="translate(12, 12)">
      <rect width="146" height="100" rx="12" fill="#0E1217" />
      <circle cx="73" cy="50" r="38" fill="#E74C3C" opacity="0.8" />
      <circle cx="73" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
    </g>
    <text x="14" y="132" class="mono" font-size="9" font-weight="800" fill="#7F8B92">LAYER 01</text>
    <text x="14" y="148" class="sans" font-size="12.5" font-weight="900" fill="#0E0E0C">Original Scan</text>
    <text x="14" y="165" class="sans" font-size="9.5" font-weight="600" fill="#303A40">Raw 45° posterior</text>
    <text x="14" y="178" class="sans" font-size="9.5" font-weight="600" fill="#303A40">pole photograph</text>
    <rect x="14" y="186" width="60" height="16" rx="8" fill="#EEF5FA" />
    <text x="44" y="197" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#0E0E0C">BASELINE</text>
  </g>

  <!-- Layer 2: CLAHE -->
  <g transform="translate(230, 75)" filter="url(#layerShadow)">
    <rect width="170" height="205" rx="18" fill="#FFFFFF" stroke="#0E0E0C" stroke-width="2.5" />
    <g transform="translate(12, 12)">
      <rect width="146" height="100" rx="12" fill="#0E1217" />
      <circle cx="73" cy="50" r="38" fill="#C0392B" />
      <path d="M50 50 Q65 40 73 50 T95 60" fill="none" stroke="#F1C40F" stroke-width="1.5" />
      <circle cx="65" cy="45" r="2" fill="#FFFFFF" />
      <circle cx="82" cy="55" r="2" fill="#FFFFFF" />
    </g>
    <text x="14" y="132" class="mono" font-size="9" font-weight="800" fill="#7F8B92">LAYER 02</text>
    <text x="14" y="148" class="sans" font-size="12.5" font-weight="900" fill="#0E0E0C">CLAHE Filter</text>
    <text x="14" y="165" class="sans" font-size="9.5" font-weight="600" fill="#303A40">Contrast limited</text>
    <text x="14" y="178" class="sans" font-size="9.5" font-weight="600" fill="#303A40">adaptive histogram</text>
    <rect x="14" y="186" width="68" height="16" rx="8" fill="#FFF48D" />
    <text x="48" y="197" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#0E0E0C">ENHANCED</text>
  </g>

  <!-- Layer 3: Vessels -->
  <g transform="translate(420, 75)" filter="url(#layerShadow)">
    <rect width="170" height="205" rx="18" fill="#FFFFFF" stroke="#0E0E0C" stroke-width="2.5" />
    <g transform="translate(12, 12)">
      <rect width="146" height="100" rx="12" fill="#000000" />
      <path d="M40 70 Q60 40 73 50 T110 30 M73 50 Q80 70 95 85 M73 50 Q60 65 50 85" 
            fill="none" stroke="#46C98B" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="14" y="132" class="mono" font-size="9" font-weight="800" fill="#7F8B92">LAYER 03</text>
    <text x="14" y="148" class="sans" font-size="12.5" font-weight="900" fill="#0E0E0C">Vessel Caliber</text>
    <text x="14" y="165" class="sans" font-size="9.5" font-weight="600" fill="#303A40">Green channel</text>
    <text x="14" y="178" class="sans" font-size="9.5" font-weight="600" fill="#303A40">vascular tree extraction</text>
    <rect x="14" y="186" width="68" height="16" rx="8" fill="#E8F7ED" />
    <text x="48" y="197" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#0E0E0C">GEOMETRY</text>
  </g>

  <!-- Layer 4: Lesion Mask -->
  <g transform="translate(610, 75)" filter="url(#layerShadow)">
    <rect width="170" height="205" rx="18" fill="#FFFFFF" stroke="#0E0E0C" stroke-width="2.5" />
    <g transform="translate(12, 12)">
      <rect width="146" height="100" rx="12" fill="#0E1217" />
      <circle cx="73" cy="50" r="38" fill="#2C3E50" opacity="0.5" />
      <!-- Lesion Annotations -->
      <circle cx="62" cy="42" r="4" fill="#FF5757" />
      <rect x="56" y="36" width="12" height="12" fill="none" stroke="#FF5757" stroke-width="1" />
      <circle cx="86" cy="58" r="5" fill="#FFF48D" />
      <rect x="79" y="51" width="14" height="14" fill="none" stroke="#FFF48D" stroke-width="1" />
    </g>
    <text x="14" y="132" class="mono" font-size="9" font-weight="800" fill="#7F8B92">LAYER 04</text>
    <text x="14" y="148" class="sans" font-size="12.5" font-weight="900" fill="#0E0E0C">Lesion Overlay</text>
    <text x="14" y="165" class="sans" font-size="9.5" font-weight="600" fill="#303A40">Microaneurysms,</text>
    <text x="14" y="178" class="sans" font-size="9.5" font-weight="600" fill="#303A40">exudates &amp; bleeds</text>
    <rect x="14" y="186" width="60" height="16" rx="8" fill="#FEE2E2" />
    <text x="44" y="197" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#FF5757">PATHOLOGY</text>
  </g>

  <!-- Layer 5: Grad-CAM -->
  <g transform="translate(800, 75)" filter="url(#layerShadow)">
    <rect width="170" height="205" rx="18" fill="#FFFFFF" stroke="#0E0E0C" stroke-width="2.5" />
    <g transform="translate(12, 12)">
      <rect width="146" height="100" rx="12" fill="#0E1217" />
      <!-- Saliency Heatmap simulation -->
      <circle cx="70" cy="48" r="30" fill="#FF3838" opacity="0.75" />
      <circle cx="70" cy="48" r="20" fill="#FF9F1A" opacity="0.85" />
      <circle cx="70" cy="48" r="10" fill="#FFF200" opacity="0.9" />
    </g>
    <text x="14" y="132" class="mono" font-size="9" font-weight="800" fill="#7F8B92">LAYER 05</text>
    <text x="14" y="148" class="sans" font-size="12.5" font-weight="900" fill="#0E0E0C">Grad-CAM Map</text>
    <text x="14" y="165" class="sans" font-size="9.5" font-weight="600" fill="#303A40">Model activation &amp;</text>
    <text x="14" y="178" class="sans" font-size="9.5" font-weight="600" fill="#303A40">spatial saliency</text>
    <rect x="14" y="186" width="65" height="16" rx="8" fill="#FFEAA7" />
    <text x="46.5" y="197" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D35400">ATTENTION</text>
  </g>

  <!-- Layer 6: Multimodal Combined -->
  <g transform="translate(990, 75)" filter="url(#layerShadow)">
    <rect width="170" height="205" rx="18" fill="#0E0E0C" stroke="#0E0E0C" stroke-width="2.5" />
    <g transform="translate(12, 12)">
      <rect width="146" height="100" rx="12" fill="#1C242B" />
      <!-- Combined visual stack -->
      <circle cx="73" cy="50" r="36" fill="#C0392B" opacity="0.7" />
      <path d="M50 50 Q65 40 73 50 T95 60" fill="none" stroke="#46C98B" stroke-width="1.8" />
      <circle cx="65" cy="45" r="3" fill="#FFF48D" />
      <circle cx="82" cy="55" r="14" fill="#FF5757" opacity="0.5" />
    </g>
    <text x="14" y="132" class="mono" font-size="9" font-weight="800" fill="#8ED8FF">LAYER 06</text>
    <text x="14" y="148" class="sans" font-size="12.5" font-weight="900" fill="#FFFFFF">Multimodal</text>
    <text x="14" y="165" class="sans" font-size="9.5" font-weight="600" fill="#CFCFC4">Calibrated synthesis</text>
    <text x="14" y="178" class="sans" font-size="9.5" font-weight="600" fill="#CFCFC4">for clinical sign-off</text>
    <rect x="14" y="186" width="60" height="16" rx="8" fill="#8ED8FF" />
    <text x="44" y="197" text-anchor="middle" class="mono" font-size="8" font-weight="900" fill="#0E0E0C">SYNTHESIS</text>
  </g>
</svg>
